<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>الصفحة غير موجودة</title>
<script>
(function () {
  try {
    var p = decodeURIComponent(location.pathname || "/");
    if (/^\/warsha(\/|$)/.test(p)) {
      var rest = p.replace(/^\/warsha/, "");
      rest = rest.replace(/index\.html$/, "").replace(/\.html$/, "");
      if (!rest) rest = "/";
      location.replace("https://octopus.page" + rest + location.search + location.hash);
    }
  } catch (e) {}
})();
</script>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0f13;color:#eef1f6;
       font-family:"Segoe UI",Tahoma,system-ui,sans-serif;text-align:center;padding:24px}
  .card{max-width:520px}
  h1{font-size:26px;margin:0 0 10px}
  p{color:#9aa3b2;line-height:1.9;margin:0 0 18px}
  a{display:inline-block;margin:6px;padding:10px 18px;border-radius:10px;background:#e11d2a;
    color:#fff;text-decoration:none;font-weight:700}
  a.alt{background:#1b2130;border:1px solid #2b3342;color:#eef1f6;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <h1>الصفحة غير موجودة</h1>
    <p>الرابط اللي بتفتحه مش موجود على الموقع ده.</p>
    <a href="https://octopus.page/">موقع الورشة</a>
    <a class="alt" href="/">الصفحة الرئيسية</a>
  </div>
</body>
</html>
